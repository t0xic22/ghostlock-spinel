# GhostLock adaptation template (6.6).
# Copy this file, fill every null value, and register it with
# uname -r release / file in kernel_profiles/index.conf.
# Purpose: copy this file and fill in every value. The debug page 'Load other built-in profile' can load it manually to inspect the field structure.
# Steps:
#   1. Replace `release` with the device's `uname -r` and rename the file to <release>.conf;
#   2. Fill in every `null` (geometry / offsets / route), and delete route branches that are not used;
#   3. Register { release = ..., file = ... } in the `profiles` array of index.conf.
# Execution tuning is supplied by the resolver from preset files. Shared 6.x credential / kernel-snitch values can be pulled in with `include` — do not copy them.

# Must match the device's `uname -r` exactly (case-sensitive, including suffix); replace this template name before shipping
release = "6.6-template"
# Profile schema version; always 1
schema_version = 1
# Kernel major version (5 or 6), used for address resolution and validation
kernel_major = 6
# Whether this kernel recommends the Shizuku path (0/1, default 0; a hint only, never enforced)
recommend_shizuku = null
# Kernel physical load address (null if unknown; runtime falls back to a SoC-specific formula)
kernel_phys_load = null
# DRAM base / linear-map PHYS_OFFSET (falls back to the compile-time default; cannot be extracted from boot.img, read from /proc/iomem)
kernel_phys_offset = null
# Explicit route parent: keep only the branch actually used and delete the other branch blocks
route {
  # tcp_zerocopy route
  tcp_zerocopy {
    # Flag for the compact waiter layout of the tcp route (0/1)
    compact_waiter = null
  }
  # select() wait-stack route
  select_stack {
    # Waiter's relative stack offset (0 is valid; negative values are common)
    waiter_shift = null
  }
}
# Fallback declaration: fall back to select_stack if the tcp route fails; delete the whole block if no fallback is used
fallback {
  # Fallback target route name, or "none" to disable fallback
  to = null
  # Fields needed by the fallback route (fill only when a fallback is declared)
  route {
    select_stack {
      # Waiter offset for the fallback select route (0 is valid)
      waiter_shift = null
    }
  }
}
# KernelSnitch parameters (mm_struct leak search; shared by all routes)
kernelsnitch {
  # Number of futex collisions required by KernelSnitch
  collisions = null
}
# Task structure field offsets (relative to the start of task_struct)
task_struct {
  # Task priority (used for PI-boost decisions)
  prio = null
  # Task's normal priority
  normal_prio = null
  # Offset of sched_task_group
  sched_task_group = null
  # Offset of the pi_lock spinlock
  pi_lock = null
  # Offset of the pi_waiters list
  pi_waiters = null
  # Offset of pi_top_task
  pi_top_task = null
  # Offset of pi_blocked_on
  pi_blocked_on = null
  # Offset of pid
  pid = null
  # Offset of tgid
  tgid = null
  # Offset of atomic_flags (used for in-place cleanup decisions)
  atomic_flags = null
  # Offset of the real_cred pointer
  real_cred = null
  # Offset of the cred pointer
  cred = null
  # Offset of comm
  comm = null
  # Offset of the task list (tasks)
  tasks = null
  # Offset of seccomp
  seccomp = null
}
# Credentials template (cred structure copy and reference-count fixups)
cred {
  # Offset of the capability sets
  caps_offset = null
  # Total copy size of the cred structure
  copy_size = null
  # Target value for the reference count
  usage_value = null
  # Number of capability words
  caps_count = null
  # Value used to fill the capability words
  caps_value = null
}
# Kernel symbol offsets (relative to the kernel image base)
offset {
  # Offset of init_task relative to the kernel image base
  init_task = null
  # Offset of init_cred
  init_cred = null
  # Offset of root_task_group
  root_task_group = null
  # Offset of selinux_state.enforcing (W1 writes 0 here)
  selinux_enforcing = null
  # Offset of selinux_blob_sizes
  selinux_blob_sizes = null
  # Offset of security_hook_heads
  security_hook_heads = null
  # KASLR slide anchor: nfulnl_logger
  slide_nfulnl_logger = null
  # KASLR slide anchor: boot_id
  slide_boot_id = null
  # KASLR slide anchor: loggers[0..1]
  slide_loggers_0_1 = null
}
